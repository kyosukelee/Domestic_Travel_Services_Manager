<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国内旅行業務取扱管理者試験 問題演習</title>
<meta name="description" content="国内旅行業務取扱管理者試験の独学用問題演習アプリ。一次資料に基づく独自問題210問・模試・苦手論点抽出・フラッシュカード・デイリーチャレンジを収録した非公式学習ツール。">
<meta name="theme-color" content="#1a2b4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="国内管理者演習">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1e8;
  --paper:#fbfaf4;
  --ink:#1a2b4a;
  --ink-soft:#4a5a78;
  --ink-faint:#8a93a8;
  --vermillion:#b8362a;
  --vermillion-dark:#8b2418;
  --gold:#b88a2a;
  --gold-soft:#d4b86a;
  --line:#d5cdb7;
  --line-soft:#e6dfc9;
  --correct:#2a6b4a;
  --correct-bg:#e3ede5;
  --incorrect:#b8362a;
  --incorrect-bg:#f1dfdc;
  --shadow:0 1px 2px rgba(26,43,74,.04), 0 4px 16px rgba(26,43,74,.06);
  --font-serif:'Noto Serif JP', serif;
  --font-sans:'Noto Sans JP', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font-sans);
  background:var(--bg);
  color:var(--ink);
  line-height:1.75;
  font-size:15px;
  background-image:
    radial-gradient(circle at 15% 20%, rgba(184,138,42,.05) 0%, transparent 45%),
    radial-gradient(circle at 85% 80%, rgba(26,43,74,.04) 0%, transparent 45%);
  background-attachment:fixed;
}
#app{max-width:880px;margin:0 auto;padding:24px 20px 80px}
.screen{animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* Header */
.hdr{
  display:flex;align-items:flex-end;justify-content:space-between;
  padding-bottom:18px;margin-bottom:28px;
  border-bottom:1px solid var(--line);
  position:relative;
}
.hdr::after{
  content:"";position:absolute;left:0;right:0;bottom:-3px;height:1px;
  background:var(--line-soft);
}
.hdr-title{
  font-family:var(--font-serif);
  font-weight:700;
  font-size:22px;
  letter-spacing:.04em;
  color:var(--ink);
}
.hdr-title .sub{
  display:block;font-size:11px;font-weight:400;letter-spacing:.3em;
  color:var(--gold);margin-bottom:4px;text-transform:uppercase;
}
.hdr-nav{display:flex;gap:14px;font-size:13px}
.hdr-nav a{color:var(--ink-soft);text-decoration:none;cursor:pointer;border-bottom:1px solid transparent;padding-bottom:2px;transition:all .2s}
.hdr-nav a:hover{color:var(--vermillion);border-bottom-color:var(--vermillion)}

/* Cards & sections */
.card{
  background:var(--paper);border:1px solid var(--line);
  padding:24px;margin-bottom:18px;
  box-shadow:var(--shadow);
  position:relative;
}
.card-head{
  font-family:var(--font-serif);font-weight:700;font-size:17px;
  margin-bottom:14px;padding-bottom:10px;
  border-bottom:1px solid var(--line-soft);
  display:flex;align-items:center;gap:10px;
}
.card-head::before{
  content:"";width:3px;height:16px;background:var(--vermillion);
}

/* Dashboard */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}
.dash-cell{
  background:var(--paper);border:1px solid var(--line);
  padding:18px 20px;text-align:left;
}
.dash-cell .label{font-size:11px;letter-spacing:.2em;color:var(--ink-faint);text-transform:uppercase;margin-bottom:6px}
.dash-cell .value{font-family:var(--font-serif);font-size:28px;font-weight:700;color:var(--ink);line-height:1.2}
.dash-cell .value .unit{font-size:14px;color:var(--ink-soft);margin-left:4px}

/* Subject progress bars */
.subj-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.subj-row:last-child{border-bottom:none}
.subj-name{flex:0 0 160px;font-family:var(--font-serif);font-weight:500;font-size:14px}
.subj-bar{flex:1;height:6px;background:var(--line-soft);position:relative;overflow:hidden}
.subj-bar-fill{position:absolute;top:0;left:0;height:100%;background:linear-gradient(90deg,var(--gold-soft),var(--gold));transition:width .6s ease}
.subj-meta{flex:0 0 auto;font-size:12px;color:var(--ink-soft);min-width:90px;text-align:right}

/* Subject select */
.subj-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:14px}
.subj-card{
  background:var(--paper);border:1px solid var(--line);
  padding:22px 20px;cursor:pointer;
  transition:all .2s;position:relative;text-align:left;
  display:flex;flex-direction:column;gap:8px;
}
.subj-card:hover{border-color:var(--vermillion);transform:translateY(-2px);box-shadow:0 6px 20px rgba(184,54,42,.12)}
.subj-card .num{font-family:var(--font-serif);font-size:11px;letter-spacing:.3em;color:var(--gold);font-weight:500}
.subj-card .name{font-family:var(--font-serif);font-size:18px;font-weight:700}
.subj-card .desc{font-size:12px;color:var(--ink-soft);line-height:1.6}
.subj-card .stat{font-size:11px;color:var(--ink-faint);margin-top:6px;padding-top:8px;border-top:1px dashed var(--line-soft)}

/* Buttons */
.btn{
  display:inline-block;padding:11px 22px;
  font-family:var(--font-sans);font-size:14px;font-weight:500;
  background:var(--ink);color:var(--paper);border:none;cursor:pointer;
  letter-spacing:.05em;transition:all .2s;
  border-radius:0;
}
.btn:hover{background:var(--vermillion-dark)}
.btn:disabled{background:var(--ink-faint);cursor:not-allowed}
.btn-primary{background:var(--vermillion)}
.btn-primary:hover{background:var(--vermillion-dark)}
.btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--line)}
.btn-ghost:hover{background:var(--paper);border-color:var(--ink-soft);color:var(--ink)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

/* Question count chooser */
.count-row{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
.count-chip{
  padding:8px 16px;border:1px solid var(--line);background:var(--paper);
  cursor:pointer;font-size:13px;color:var(--ink-soft);
  transition:all .15s;
}
.count-chip:hover{border-color:var(--ink-soft);color:var(--ink)}
.count-chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* Practice screen */
.prac-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-size:12px;color:var(--ink-soft)}
.prac-top .progress-text{font-family:var(--font-serif);letter-spacing:.1em}
.prac-bar{height:3px;background:var(--line-soft);margin-bottom:24px;position:relative}
.prac-bar-fill{position:absolute;top:0;left:0;height:100%;background:var(--vermillion);transition:width .35s}
.q-source{font-size:11px;color:var(--gold);letter-spacing:.15em;text-transform:uppercase;margin-bottom:8px}
.q-cat{font-size:12px;color:var(--ink-faint);margin-bottom:14px}
.q-text{
  font-family:var(--font-serif);font-size:17px;font-weight:500;line-height:1.85;
  margin-bottom:22px;color:var(--ink);
}
.choices{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.choice{
  display:flex;gap:12px;align-items:flex-start;
  padding:14px 18px;border:1px solid var(--line);background:var(--paper);
  cursor:pointer;transition:all .15s;
  font-size:14px;line-height:1.7;text-align:left;width:100%;
  font-family:var(--font-sans);color:var(--ink);
}
.choice:hover:not(:disabled){border-color:var(--ink-soft);background:#fff}
.choice:disabled{cursor:default}
.choice .mark{
  flex:0 0 26px;height:26px;border:1px solid var(--ink-soft);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-serif);font-weight:500;font-size:13px;color:var(--ink-soft);
  border-radius:50%;
}
.choice.selected{border-color:var(--ink);background:#fff}
.choice.selected .mark{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.choice.correct{border-color:var(--correct);background:var(--correct-bg)}
.choice.correct .mark{background:var(--correct);color:#fff;border-color:var(--correct)}
.choice.incorrect{border-color:var(--incorrect);background:var(--incorrect-bg)}
.choice.incorrect .mark{background:var(--incorrect);color:#fff;border-color:var(--incorrect)}
.choice-text{flex:1}

/* Explanation */
.explain{
  margin-top:14px;padding:18px 20px;
  background:#fff;border-left:3px solid var(--gold);
  border:1px solid var(--line);border-left:3px solid var(--gold);
}
.explain-head{
  font-family:var(--font-serif);font-weight:700;font-size:14px;
  display:flex;align-items:center;gap:10px;margin-bottom:10px;
}
.judge-badge{
  display:inline-block;padding:3px 12px;font-size:11px;letter-spacing:.15em;
  font-weight:500;
}
.judge-badge.ok{background:var(--correct);color:#fff}
.judge-badge.ng{background:var(--incorrect);color:#fff}
.explain-body{font-size:14px;line-height:1.85;color:var(--ink)}
.explain-source{
  margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);
  font-size:11px;color:var(--ink-faint);letter-spacing:.05em;
}
.explain-source::before{content:"出典: ";color:var(--gold);font-weight:500;letter-spacing:.15em}

/* Result */
.result-score{
  text-align:center;padding:30px 20px;
  background:var(--paper);border:1px solid var(--line);margin-bottom:18px;
}
.result-score .ratio{font-family:var(--font-serif);font-size:54px;font-weight:700;color:var(--ink);line-height:1.1}
.result-score .ratio .total{color:var(--ink-faint);font-size:32px}
.result-score .label{font-size:11px;letter-spacing:.3em;color:var(--gold);margin-top:6px;text-transform:uppercase}
.result-score .pct{font-size:13px;color:var(--ink-soft);margin-top:8px}

.review-list{margin-top:10px}
.review-item{
  padding:12px 0;border-bottom:1px solid var(--line-soft);
  display:flex;gap:14px;align-items:flex-start;
}
.review-item:last-child{border-bottom:none}
.review-mark{
  flex:0 0 24px;height:24px;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:500;border-radius:50%;
}
.review-mark.ok{background:var(--correct-bg);color:var(--correct)}
.review-mark.ng{background:var(--incorrect-bg);color:var(--incorrect)}
.review-text{flex:1;font-size:13px;line-height:1.6}
.review-text .cat{font-size:11px;color:var(--ink-faint);margin-top:2px}

/* About / settings */
.kv{display:grid;grid-template-columns:140px 1fr;gap:12px 16px;font-size:13px;margin-bottom:6px}
.kv dt{color:var(--ink-faint);font-weight:500;letter-spacing:.05em}
.kv dd{color:var(--ink)}
.note{font-size:12px;color:var(--ink-soft);background:#fff;border:1px solid var(--line);padding:12px 14px;margin-top:10px;line-height:1.7}
.note strong{color:var(--vermillion-dark)}

/* Empty state */
.empty{padding:40px 20px;text-align:center;color:var(--ink-faint);font-size:13px}

/* Exam overview */
.exam-summary{
  font-size:13px;color:var(--ink-soft);margin-bottom:14px;line-height:1.85;
}
.exam-section{
  border-top:1px solid var(--line-soft);
  padding:16px 0 4px;
}
.exam-section:first-of-type{border-top:none;padding-top:4px}
.exam-section h4{
  font-family:var(--font-serif);font-size:14px;font-weight:700;
  color:var(--vermillion-dark);
  margin-bottom:10px;
  display:flex;align-items:center;gap:8px;
}
.exam-section h4::before{
  content:"";width:6px;height:6px;background:var(--gold);
  display:inline-block;
}
.exam-kv{display:grid;grid-template-columns:130px 1fr;gap:8px 14px;font-size:13px;line-height:1.7}
.exam-kv dt{color:var(--ink-faint);font-weight:500}
.exam-kv dd{color:var(--ink)}
.exam-table{
  width:100%;border-collapse:collapse;font-size:13px;margin-top:4px;
  background:#fff;
}
.exam-table th,.exam-table td{
  border:1px solid var(--line);padding:8px 12px;text-align:left;
}
.exam-table th{
  background:var(--paper);font-weight:500;font-family:var(--font-serif);
  color:var(--ink);font-size:12px;letter-spacing:.05em;
}
.exam-table td{color:var(--ink-soft)}
.exam-table tr:last-child td{font-weight:500;color:var(--ink)}
details.exam-details{
  margin-top:6px;
}
details.exam-details summary{
  cursor:pointer;font-size:13px;font-weight:500;color:var(--vermillion);
  padding:8px 0;list-style:none;
  display:flex;align-items:center;gap:8px;
}
details.exam-details summary::-webkit-details-marker{display:none}
details.exam-details summary::before{
  content:"▶";font-size:9px;transition:transform .2s;color:var(--gold);
}
details.exam-details[open] summary::before{transform:rotate(90deg)}
details.exam-details summary:hover{color:var(--vermillion-dark)}
.exam-detail-body{
  padding:8px 0 4px 16px;font-size:13px;line-height:1.85;color:var(--ink-soft);
}
.exam-note{
  font-size:11px;color:var(--ink-faint);margin-top:16px;
  padding:10px 12px;background:#fff;border:1px dashed var(--line);
  line-height:1.7;
}

/* Toast */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:10px 20px;
  font-size:13px;letter-spacing:.05em;
  opacity:0;transition:opacity .25s;pointer-events:none;z-index:99;
}
.toast.show{opacity:1}

/* Footer mark */
.footer-mark{
  text-align:center;margin-top:40px;padding-top:20px;
  border-top:1px solid var(--line-soft);
  font-size:10px;color:var(--ink-faint);letter-spacing:.3em;
}

/* Weak topics (苦手論点) */
.weak-list{display:flex;flex-direction:column;gap:8px}
.weak-item{
  display:flex;align-items:center;gap:14px;
  padding:12px 16px;background:#fff;border:1px solid var(--line);
  transition:all .15s;
}
.weak-item:hover{border-color:var(--vermillion-dark)}
.weak-rank{
  flex:0 0 28px;height:28px;border-radius:50%;
  background:var(--vermillion);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-serif);font-weight:700;font-size:13px;
}
.weak-body{flex:1;min-width:0}
.weak-cat{
  font-family:var(--font-serif);font-weight:500;font-size:14px;color:var(--ink);
  line-height:1.4;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.weak-sub{
  font-size:11px;color:var(--ink-faint);letter-spacing:.05em;margin-top:2px;
}
.weak-stat{flex:0 0 auto;text-align:right;min-width:74px}
.weak-pct{
  font-family:var(--font-serif);font-weight:700;font-size:20px;line-height:1.2;
}
.weak-meta{font-size:10px;color:var(--ink-faint);letter-spacing:.05em;margin-top:2px}

/* Mastery map */
.mastery-legend{
  display:flex;gap:14px;flex-wrap:wrap;
  margin:14px 0 20px;padding:12px 14px;
  background:#fff;border:1px solid var(--line);
  font-size:11px;
}
.mastery-legend .item{display:flex;align-items:center;gap:6px;color:var(--ink-soft)}
.mastery-legend .dot{
  width:10px;height:10px;border-radius:50%;
}
.mastery-section{margin-bottom:24px}
.mastery-section-head{
  font-family:var(--font-serif);font-weight:700;font-size:14px;
  margin-bottom:10px;padding-bottom:6px;
  border-bottom:1px solid var(--line-soft);
  color:var(--ink);
  display:flex;align-items:center;gap:10px;
}
.mastery-section-head::before{
  content:"";width:3px;height:14px;background:var(--gold);
}
.mastery-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:10px;
}
.mastery-cell{
  padding:12px 14px;background:#fff;border:1px solid var(--line);
  display:flex;align-items:center;gap:10px;
  border-left-width:3px;
}
.mastery-cell .name{
  flex:1;font-size:13px;line-height:1.5;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;
}
.mastery-cell .pct{
  flex:0 0 auto;font-family:var(--font-serif);font-weight:700;font-size:14px;
}
.mastery-cell .meta{font-size:10px;color:var(--ink-faint);margin-top:2px;letter-spacing:.05em}

/* Mock exam (模試) */
.mock-intro{
  background:#fff;border:1px solid var(--line);padding:18px 20px;margin-bottom:14px;
  font-size:13px;line-height:1.85;color:var(--ink);
}
.mock-intro strong{color:var(--vermillion-dark);font-weight:700}

.mock-bar{
  position:sticky;top:0;z-index:20;
  background:var(--paper);border-bottom:2px solid var(--vermillion);
  padding:10px 14px;margin:-24px -24px 18px;
  display:flex;justify-content:space-between;align-items:center;gap:14px;
}
.mock-timer{
  font-family:var(--font-serif);font-weight:700;font-size:22px;
  color:var(--ink);letter-spacing:.04em;
}
.mock-timer.warn{color:var(--vermillion);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.mock-progress{
  font-size:11px;color:var(--ink-soft);letter-spacing:.1em;
}
.mock-progress .qnum{font-family:var(--font-serif);font-weight:700;color:var(--ink);font-size:14px}

.mock-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));
  gap:6px;margin:14px 0;
}
.mock-cell{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-serif);font-weight:500;font-size:12px;
  background:#fff;border:1px solid var(--line);cursor:pointer;
  transition:all .15s;color:var(--ink-soft);
}
.mock-cell:hover{border-color:var(--ink-soft);color:var(--ink)}
.mock-cell.answered{background:var(--paper);border-color:var(--ink-soft);color:var(--ink)}
.mock-cell.current{background:var(--vermillion);color:#fff;border-color:var(--vermillion)}

.mock-nav{
  display:flex;gap:8px;flex-wrap:wrap;
  padding:14px 0;margin-top:10px;
  border-top:1px solid var(--line-soft);
}
.mock-nav .btn{padding:8px 16px;font-size:13px}

/* Mock result */
.mock-subj-score{
  display:flex;align-items:center;gap:14px;
  padding:14px 18px;background:#fff;border:1px solid var(--line);
  margin-bottom:10px;
}
.mock-subj-score.pass{border-left:3px solid var(--correct)}
.mock-subj-score.fail{border-left:3px solid var(--incorrect)}
.mock-subj-score .label{
  flex:1;font-family:var(--font-serif);font-weight:500;font-size:14px;
}
.mock-subj-score .score{
  font-family:var(--font-serif);font-weight:700;font-size:22px;
  min-width:90px;text-align:right;
}
.mock-subj-score .score .max{font-size:13px;color:var(--ink-faint);font-weight:400}
.mock-subj-score .judge{
  min-width:60px;text-align:center;font-size:11px;font-weight:500;
  padding:4px 10px;letter-spacing:.15em;
}
.mock-subj-score.pass .judge{background:var(--correct);color:#fff}
.mock-subj-score.fail .judge{background:var(--incorrect);color:#fff}

.mock-total{
  text-align:center;padding:30px 20px;
  background:var(--paper);border:1px solid var(--line);margin-bottom:18px;
}
.mock-total .label{font-size:11px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase;margin-bottom:6px}
.mock-total .verdict{
  font-family:var(--font-serif);font-size:34px;font-weight:700;line-height:1.2;
  letter-spacing:.1em;
}
.mock-total.pass .verdict{color:var(--correct)}
.mock-total.fail .verdict{color:var(--vermillion)}
.mock-total .detail{font-size:12px;color:var(--ink-soft);margin-top:8px}

.mock-history-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.mock-history-row{
  display:flex;gap:14px;align-items:center;
  padding:10px 14px;background:#fff;border:1px solid var(--line);
  font-size:12px;
}
.mock-history-row .date{flex:0 0 auto;font-family:var(--font-serif);color:var(--ink-soft);min-width:120px}
.mock-history-row .scores{flex:1;display:flex;gap:10px;flex-wrap:wrap;font-size:11px}

.flashcard-hint{

.flash-conf-btn{

.flash-conf-btn.again{color:var(--vermillion)}

.daily-banner{

}
.daily-banner::after{

}
.daily-banner .date{
  font-size:11px;letter-spacing:.3em;color:var(--gold-soft);
  text-transform:uppercase;margin-bottom:6px;
}
.daily-banner .title{
  font-family:var(--font-serif);font-size:22px;font-weight:700;
  margin-bottom:8px;
}
.daily-banner .desc{font-size:13px;color:rgba(251,250,244,.85);line-height:1.7}
.daily-status{
  display:inline-block;margin-top:12px;padding:5px 14px;
  font-size:12px;letter-spacing:.1em;
  background:rgba(251,250,244,.15);border:1px solid rgba(251,250,244,.3);
}
.daily-status.done{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.daily-streak{

.daily-streak .flame{font-size:18px}

@media (max-width:600px){

  #app{padding:18px 14px 60px}

}

/* ============================================================
   国内旅行業務取扱管理者試験 問題演習 -- Phase 1 骨組み
   ------------------------------------------------------------
   本アプリで使用している問題は、すべて一次資料（旅行業法、

   ============================================================ */

const APP_VERSION = "0.9.0-phase6";
const STORAGE_KEY = "kokunai_kanri_data_v1";

/* ---------- 科目定義 ---------- */
const SUBJECTS = [
  {id:"law",      no:"I",   name:"旅行業法令",     desc:"旅行業法及びこれに基づく命令",                qCount:25, pass:60},
  {id:"yakkan",   no:"II",  name:"約款",           desc:"旅行業約款、運送約款及び宿泊約款",            qCount:25, pass:60},
  {id:"domestic", no:"III", name:"国内旅行実務",   desc:"運送・宿泊料金、業務取扱の実務、観光地理",   qCount:38, pass:60},
];
const SUBJECT_BY_ID = Object.fromEntries(SUBJECTS.map(s=>[s.id,s]));

/* ---------- 問題データ（Phase 1：60問・全て一次資料ベースの独自作成） ---------- */
const QUESTIONS = [
  /* ============================================================
     I. 旅行業法令（20問）
     ============================================================ */
  {
    id:"law_001", subject:"law", category:"法第1条 目的",
    question:"旅行業法第1条「目的」に関する次の記述のうち、同条に明示的に定められているものとして正しいものはどれか。",
    choices:[
      "旅行業等を営む者についてその業務の適正な運営を確保すること",
      "旅行業者の組織する団体の自由な活動を促進すること",
      "訪日外国人旅行者の誘致を通じた観光立国の促進",
      "旅行業者を通じた地方創生と国民経済の発展"
    ],
    answer:0,
    explanation:"旅行業法第1条は、旅行業等を営む者の業務の適正な運営の確保と公正な競争の促進、旅行業務に関する取引の公正の維持、旅行の安全の確保、旅行者の利便の増進を目的として定めている。「団体の自由な活動の促進」「訪日誘致」「地方創生」は条文に明示されていない。",
    source:"旅行業法 第1条"
  },
  {
    id:"law_002", subject:"law", category:"法第2条 登録要否",
    question:"報酬を得て事業として行う場合、旅行業の登録を要する行為として正しいものはどれか。",
    choices:[
      "自社所有のタクシーのみを用いて市内観光案内を行い、運送サービスを販売する行為",
      "宿泊事業者が、自ら経営する宿泊施設の宿泊プランと、他人が経営する宿泊施設の宿泊プランをセットにして販売する行為",

    source:"旅行業法 第2条、第3条"

  {

    question:"旅行業及び旅行業者代理業の登録に関する次の記述のうち、誤っているものはどれか。",
    choices:[

      "旅行業の登録の有効期間は、登録の日から起算して5年である"

    answer:2,
    explanation:"地域限定旅行業の新規登録申請先は、主たる営業所の所在地を管轄する都道府県知事である。観光庁長官への申請は第1種旅行業に限られる。",
    source:"旅行業法 第3条、第6条の2"
  },
  {
    id:"law_004", subject:"law", category:"法第4条 登録業務範囲",
    question:"旅行業の登録業務範囲に関する次の記述のうち、誤っているものはどれか（いずれも取扱管理者の選任要件は満たされているものとする）。",
    choices:[

      "第3種旅行業者は、本邦外の募集型企画旅行を実施することができる"

    answer:3,
    explanation:"第3種旅行業者は、本邦外の募集型企画旅行を実施することはできない。本邦内の拠点区域内に限り、一の企画旅行ごとに一の拠点区域内で実施される募集型企画旅行のみ実施可能である。",

    answer:0,
    explanation:"第3種旅行業の基準資産額は300万円であり、500万円はこれを上回るため拒否事由に該当しない。罰金経過5年未満・申請前5年内の不正・心身故障はいずれも拒否事由に該当する。",
    source:"旅行業法 第6条、同施行規則"
  },
  {
    id:"law_006", subject:"law", category:"法第7条 営業保証金",
    question:"営業保証金に関する次の記述のうち、正しいものはどれか。",
    choices:[
      "旅行業者は、営業保証金を供託した旨を登録行政庁に届け出る前であっても、事業を開始することができる",

      "旅行業者代理業者は、所属旅行業者の主たる営業所の最寄りの供託所に営業保証金を供託しなければならない",

  },

    id:"law_007", subject:"law", category:"法第11条の2 取扱管理者選任",

    choices:[

    question:"次の事項のうち、旅行業務取扱管理者の職務として旅行業法に定められていないものはどれか。",

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultData();
    const obj = JSON.parse(raw);
    if(!obj.history) obj.history = [];
    if(!obj.settings) obj.settings = {};
    if(!obj.mockHistory) obj.mockHistory = [];
    if(!obj.bookmarks) obj.bookmarks = [];
    if(!obj.dailyHistory) obj.dailyHistory = [];
    return obj;
  }catch(e){
    console.warn("data load failed", e);
    return defaultData();
  }
}
function defaultData(){ return {version:APP_VERSION, history:[], settings:{}, mockHistory:[], bookmarks:[], dailyHistory:[]}; }
function saveData(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data)); }
  catch(e){ console.warn("save failed", e); }
}

/* ---------- ユーティリティ ---------- */
function $(sel, root){ return (root||document).querySelector(sel); }
function el(tag, attrs, children){
  const e = document.createElement(tag);
  if(attrs) for(const k in attrs){
    const v = attrs[k];
    if(v == null || v === false) continue;
    if(k === "class") e.className = v;
    else if(k === "html") e.innerHTML = v;
    else if(k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  if(children){
    (Array.isArray(children)?children:[children]).forEach(c=>{
      if(c == null) return;
      e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
  }
  return e;
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove("show"), 1800);
}

/* ---------- 統計 ---------- */
function statsBySubject(){
  const out = {};
  SUBJECTS.forEach(s=>{ out[s.id] = {total:0, correct:0, attempted:new Set()}; });
  state.data.history.forEach(h=>{
    const q = QUESTIONS.find(x=>x.id===h.qid);
    if(!q) return;
    const s = out[q.subject];
    if(!s) return;
    s.total++;
    if(h.correct) s.correct++;
    s.attempted.add(h.qid);
  });
  return out;
}
function overallStats(){
  const total = state.data.history.length;
  const correct = state.data.history.filter(h=>h.correct).length;
  const uniq = new Set(state.data.history.map(h=>h.qid)).size;
  return {total, correct, uniq, pct: total ? Math.round(correct/total*100) : 0};
}

   返り値: [{subject, category, attempts, correct, pct, lastTs, qIds}] */
function statsByCategory(){
  const map = {};
  state.data.history.forEach(h=>{
    const q = QUESTIONS.find(x=>x.id===h.qid);
    if(!q) return;
    const key = `${q.subject}::${q.category}`;
    if(!map[key]){
      map[key] = {
        subject:q.subject,
        category:q.category,
        attempts:0,
        correct:0,
        lastTs:0,
        qIds:new Set()
      };
    }
    map[key].attempts++;
    if(h.correct) map[key].correct++;
    if(h.ts > map[key].lastTs) map[key].lastTs = h.ts;
    map[key].qIds.add(h.qid);
  });
  return Object.values(map).map(s=>({
    ...s,
    pct: s.attempts ? Math.round(s.correct/s.attempts*100) : 0,
    qIds: Array.from(s.qIds)
  }));
}

/* 苦手論点 Top N（試行回数2回以上で正答率の低い順、同率ならlastTsの古い順） */
function weakTopics(n=10){
  const cats = statsByCategory().filter(c => c.attempts >= 2);
  cats.sort((a,b)=>{
    if(a.pct !== b.pct) return a.pct - b.pct;
    return a.lastTs - b.lastTs;
  });
  return cats.slice(0, n);
}

/* 習熟度レベル（5段階） */
function masteryLevel(pct, attempts){
  if(attempts < 2) return {level:0, label:"未習得", color:"var(--ink-faint)"};
  if(pct < 40)     return {level:1, label:"要強化", color:"var(--vermillion)"};
  if(pct < 60)     return {level:2, label:"弱",     color:"#d9651a"};
  if(pct < 80)     return {level:3, label:"普通",   color:"var(--gold)"};
  if(pct < 100)    return {level:4, label:"良",     color:"#5a8c5e"};
  return                   {level:5, label:"完全",   color:"var(--correct)"};
}

/* ---------- 誤答ノート ----------
   直近の解答が誤答だった問題を抽出。同じ問題を再演習して正答した場合は除外する。 */
function getWrongQuestions(){
  const lastByQid = {};
  // 各問題の最新の解答記録を取得
  state.data.history.forEach(h=>{
    if(!lastByQid[h.qid] || lastByQid[h.qid].ts < h.ts){
      lastByQid[h.qid] = h;
    }
  });
  return Object.values(lastByQid)
    .filter(h => !h.correct)
    .sort((a,b) => b.ts - a.ts)
    .map(h => QUESTIONS.find(q => q.id === h.qid))
    .filter(q => q != null);
}

/* ---------- デイリーチャレンジ ---------- */
const DAILY_COUNT = 10; // 1日の出題数

// 日付文字列（YYYY-MM-DD）をローカルタイムで取得
function todayKey(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

// 文字列から決定的な数値シードを生成
function seedFromString(str){
  let h = 2166136261;
  for(let i=0;i<str.length;i++){
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

// シード付き擬似乱数（mulberry32）
function seededRandom(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// その日のデイリーチャレンジ問題（日付固定）を取得
function getDailyQuestions(){
  const key = todayKey();
  const rand = seededRandom(seedFromString("daily-" + key));
  // 全問題を決定的にシャッフル
  const pool = QUESTIONS.slice();
  for(let i=pool.length-1;i>0;i--){
    const j = Math.floor(rand() * (i+1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.slice(0, DAILY_COUNT);
}

// 今日のデイリーチャレンジが完了済みか
function isDailyDoneToday(){
  const key = todayKey();
  return (state.data.dailyHistory || []).some(d => d.date === key);
}

// 今日のデイリー結果を取得
function getTodayDailyResult(){
  const key = todayKey();
  return (state.data.dailyHistory || []).find(d => d.date === key);
}

// 連続日数（ストリーク）を計算
function getDailyStreak(){
  const hist = (state.data.dailyHistory || []).slice().sort((a,b)=>a.date.localeCompare(b.date));
  if(hist.length === 0) return 0;
  const dates = new Set(hist.map(d => d.date));
  let streak = 0;
  const d = new Date();
  // 今日完了していなければ、昨日から数える
  const todayStr = todayKey();
  if(!dates.has(todayStr)){
    d.setDate(d.getDate() - 1);
  }
  // 連続している日数を数える
  for(;;){
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    if(dates.has(key)){
      streak++;
      d.setDate(d.getDate() - 1);
    } else {
      break;
    }
  }
  return streak;
}

/* ---------- 画面: 演習設定 ---------- */
function renderPracticeSetup(){
  const subjectId = state.selectedSubject || "all";
  const subject = subjectId === "all"
    ? {id:"all", name:"全分野ランダム", desc:"全科目からランダムに出題"}
    : SUBJECT_BY_ID[subjectId];

  const pool = subjectId === "all" ? QUESTIONS : QUESTIONS.filter(q=>q.subject===subjectId);
  const maxQ = pool.length;
  const presets = [5, 10, 20, 30, maxQ].filter((n,i,a)=>n<=maxQ && a.indexOf(n)===i);

  state.practiceCount = state.practiceCount && presets.includes(state.practiceCount) ? state.practiceCount : presets[0];

  const root = el("div", {class:"screen"});
  root.appendChild(headerEl());

  const card = el("div", {class:"card"});
  card.appendChild(el("div", {class:"card-head"}, `${subject.name} - 演習設定`));
  card.appendChild(el("div", {style:"font-size:13px;color:var(--ink-soft)"}, subject.desc || ""));
  card.appendChild(el("div", {style:"font-size:12px;color:var(--ink-faint);margin-top:8px"},
    `収録問題数: ${maxQ} 問`));

  // 論点絞り込みセクション（subjectId !== "all" のときのみ）
  if(subjectId !== "all"){
    card.appendChild(el("div", {style:"font-size:12px;letter-spacing:.15em;color:var(--ink-faint);margin-top:18px;text-transform:uppercase"}, "論点の絞り込み"));

    // 全論点を取得
    const allCats = [...new Set(pool.map(q=>q.category))].sort();
    if(!state.selectedTopics) state.selectedTopics = new Set();

    // この科目用に有効な論点のみ
    const validCats = new Set(allCats);
    const checkedNow = Array.from(state.selectedTopics).filter(c => validCats.has(c));

    const selector = el("div", {class:"topic-selector"});
    const selHead = el("div", {class:"topic-selector-head"}, [
      el("span", null, [
        document.createTextNode("選択中: "),
        el("span", {class:"count"}, `${checkedNow.length}`),
        document.createTextNode(` / ${allCats.length} 論点`)
      ]),
      el("div", {class:"topic-selector-actions"}, [
        el("a", {onclick:()=>{
          state.selectedTopics = new Set(allCats);
          render();
        }}, "全選択"),
        el("a", {onclick:()=>{
          state.selectedTopics = new Set();
          render();
        }}, "全解除"),
      ])
    ]);
    selector.appendChild(selHead);

    const checks = el("div", {class:"topic-checks"});
    const subjStat = statsByCategory();
    const statMap = {};
    subjStat.forEach(s=>{ statMap[`${s.subject}::${s.category}`] = s; });

    allCats.forEach(catName=>{
      const checked = state.selectedTopics.has(catName);
      const stKey = `${subjectId}::${catName}`;
      const st = statMap[stKey];
      const pct = st ? st.pct : null;
      const ml = st ? masteryLevel(st.pct, st.attempts) : {color:"var(--ink-faint)"};

      const label = el("label", {class:"topic-check" + (checked?" checked":"")}, [
        el("input", {
          type:"checkbox",
          checked: checked ? "" : null,
          onchange:(e)=>{
            if(e.target.checked) state.selectedTopics.add(catName);
            else state.selectedTopics.delete(catName);
            render();
          }
        }),
        el("span", {class:"name"}, catName),
        el("span", {class:"pct", style:`color:${ml.color}`}, st ? `${pct}%` : "-")
      ]);
      checks.appendChild(label);
    });
    selector.appendChild(checks);
    card.appendChild(selector);
  }

  // 出題数選択
  // 有効な問題プールサイズを再計算
  let effectiveMax = maxQ;
  let effectivePool = pool;
  if(subjectId !== "all" && state.selectedTopics && state.selectedTopics.size > 0){
    effectivePool = pool.filter(q => state.selectedTopics.has(q.category));
    effectiveMax = effectivePool.length;
  }
  const effPresets = [5, 10, 20, 30, effectiveMax].filter((n,i,a)=>n<=effectiveMax && n>0 && a.indexOf(n)===i);
  state.practiceCount = state.practiceCount && effPresets.includes(state.practiceCount) ? state.practiceCount : (effPresets[0] || 0);

  card.appendChild(el("div", {style:"font-size:12px;letter-spacing:.15em;color:var(--ink-faint);margin-top:18px;text-transform:uppercase"},
    `出題数（対象: ${effectiveMax}問）`));

  if(effectiveMax === 0){
    card.appendChild(el("div", {style:"font-size:13px;color:var(--vermillion);margin-top:8px"},
      "選択された論点に該当する問題がありません。論点を選び直してください。"));
  } else {
    const countRow = el("div", {class:"count-row"});
    effPresets.forEach(n=>{
      const chip = el("button", {
        class:"count-chip" + (n===state.practiceCount?" active":""),
        onclick:()=>{ state.practiceCount = n; render(); }
      }, `${n} 問${n===effectiveMax?"（全問）":""}`);
      countRow.appendChild(chip);
    });
    card.appendChild(countRow);
  }

  card.appendChild(el("div", {class:"btn-row", style:"margin-top:24px"}, [
    el("button", {
      class:"btn btn-primary",
      disabled: effectiveMax === 0 ? "" : null,
      onclick:()=>startPractice(subjectId, state.practiceCount)
    }, "演習を開始"),
    el("button", {class:"btn btn-ghost", onclick:()=>nav("subject-select")}, "戻る"),
  ]));

  root.appendChild(card);
  return root;
}

function startPractice(subjectId, count){
  let pool = subjectId === "all" ? QUESTIONS : QUESTIONS.filter(q=>q.subject===subjectId);
  // 論点フィルタが有効ならさらに絞り込む
  if(subjectId !== "all" && state.selectedTopics && state.selectedTopics.size > 0){
    pool = pool.filter(q => state.selectedTopics.has(q.category));
  }
  if(pool.length === 0){
    toast("該当する問題がありません");
    return;
  }
  const actualCount = Math.min(count, pool.length);
  const queue = shuffle(pool).slice(0, actualCount).map(q=>q.id);
  state.practice = {
    subject: subjectId,
    qCount: actualCount,
    queue, idx: 0,
    answers: [],
    startTime: Date.now(),
    selected: null,
    locked: false
  };
  nav("practice");
}

/* 苦手論点演習：Top10論点に含まれる問題を抽出してランダム最大20問 */
function startWeakPractice(){
  const weak = weakTopics(10);
  if(weak.length === 0){
    toast("苦手論点がまだ判定できません");
    return;
  }
  // 苦手論点に該当する問題IDを集める
  const targetCats = new Set(weak.map(w => `${w.subject}::${w.category}`));
  const targetQs = QUESTIONS.filter(q => targetCats.has(`${q.subject}::${q.category}`));
  if(targetQs.length === 0){
    toast("対象問題が見つかりません");
    return;
  }
  const count = Math.min(20, targetQs.length);
  const queue = shuffle(targetQs).slice(0, count).map(q=>q.id);
  state.practice = {
    subject: "weak",
    qCount: count,
    queue, idx: 0,
    answers: [],
    startTime: Date.now(),
    selected: null,
    locked: false
  };
  nav("practice");
}

/* ---------- 画面: 演習 ---------- */
function renderPractice(){
  const p = state.practice;
  const q = QUESTIONS.find(x=>x.id===p.queue[p.idx]);
  if(!q){ return renderResult(); }

  const subjName = q.subject ? SUBJECT_BY_ID[q.subject].name : "";

  const root = el("div", {class:"screen"});
  root.appendChild(headerEl());

  // 進捗
  const progPct = ((p.idx) / p.qCount) * 100;
  root.appendChild(el("div", {class:"prac-top"}, [
    el("div", {class:"progress-text"}, `${p.idx+1} / ${p.qCount}  -  ${subjName}`),
    el("div", null, `正答 ${p.answers.filter(a=>a.correct).length}`)
  ]));
  root.appendChild(el("div", {class:"prac-bar"}, [el("div", {class:"prac-bar-fill", style:`width:${progPct}%`})]));

  // 問題カード
  const card = el("div", {class:"card"});
  card.appendChild(el("div", {class:"q-source"}, `SUBJECT ${SUBJECT_BY_ID[q.subject].no}  -  ${q.category}`));
  card.appendChild(el("div", {class:"q-text"}, q.question));

  const choicesEl = el("div", {class:"choices"});
  const marks = ["ア","イ","ウ","エ","オ"];
  q.choices.forEach((c, i)=>{
    let cls = "choice";
    if(p.locked){
      if(i === q.answer) cls += " correct";
      else if(i === p.selected) cls += " incorrect";
    } else if(p.selected === i) cls += " selected";

    const btn = el("button", {class:cls, disabled: p.locked ? "" : null, onclick: ()=>selectChoice(i)}, [
      el("div", {class:"mark"}, marks[i]),
      el("div", {class:"choice-text"}, c)
    ]);
    if(p.locked) btn.disabled = true;
    choicesEl.appendChild(btn);
  });
  card.appendChild(choicesEl);

  // 解説
  if(p.locked){
    const isCorrect = p.selected === q.answer;
    const bookmarked = isBookmarked(q.id);
    const exp = el("div", {class:"explain"}, [
      el("div", {class:"explain-head"}, [
        el("span", {class:"judge-badge " + (isCorrect?"ok":"ng")}, isCorrect?"正解":"不正解"),
        el("span", null, "解説")
      ]),
      el("div", {class:"explain-body"}, q.explanation),
      el("div", {class:"explain-source"}, q.source),
      el("div", {class:"bookmark-row"}, [
        el("span", null, "重要な問題はブックマークして、復習画面でいつでも見直せます"),
        el("button", {
          class:"bookmark-btn" + (bookmarked?" active":""),
          title: bookmarked ? "ブックマーク解除" : "ブックマークに追加",
          onclick:()=>{ toggleBookmark(q.id); render(); }
        }, bookmarked ? "★" : "☆")
      ])
    ]);
    card.appendChild(exp);

    const last = p.idx + 1 >= p.qCount;
    card.appendChild(el("div", {class:"btn-row"}, [
      el("button", {class:"btn btn-primary", onclick:()=>nextQuestion()}, last ? "結果を見る" : "次の問題へ"),
      el("button", {class:"btn btn-ghost", onclick:()=>quitPractice()}, "演習を終了"),
    ]));
  } else {
    card.appendChild(el("div", {class:"btn-row"}, [
      el("button", {class:"btn btn-primary", onclick:()=>submitAnswer(), disabled: p.selected==null?"":null}, "解答する"),
      el("button", {class:"btn btn-ghost", onclick:()=>quitPractice()}, "演習を終了"),
    ]));
  }

  root.appendChild(card);
  return root;
}

function selectChoice(i){
  if(state.practice.locked) return;
  state.practice.selected = i;
  render();
}
function submitAnswer(){
  const p = state.practice;
  if(p.selected == null) return;
  const q = QUESTIONS.find(x=>x.id===p.queue[p.idx]);
  const correct = p.selected === q.answer;
  p.answers.push({qid:q.id, answered:p.selected, correct, ts: Date.now()});
  state.data.history.push({qid:q.id, answered:p.selected, correct, ts: Date.now()});
  saveData();
  p.locked = true;
  render();
}
function nextQuestion(){
  const p = state.practice;
  p.idx++;
  p.selected = null;
  p.locked = false;
  if(p.idx >= p.qCount){ nav("result"); }
  else render();
}
function quitPractice(){
  if(confirm("演習を終了します。途中までの結果は記録されます。よろしいですか？")){
    if(state.practice.answers.length > 0) nav("result");
    else nav("home");
  }
}

  // デイリーチャレンジ完了時は結果を記録

    recordDailyResult(p.answers);

  const root = el("div", {class:"screen"});
  root.appendChild(headerEl());

  const subjName = p.subject === "all" ? "全分野ランダム"
                 : p.subject === "weak" ? "苦手論点演習"

  // 個別レビュー
  const card = el("div", {class:"card"});
  card.appendChild(el("div", {class:"card-head"}, "問題ごとの結果"));
  const list = el("div", {class:"review-list"});
  p.answers.forEach((a, i)=>{
    const q = QUESTIONS.find(x=>x.id===a.qid);

      el("div", {class:"review-mark " + (a.correct?"ok":"ng")}, a.correct?"○":"×"),

    el("button", {class:"btn btn-primary", onclick:()=>nav("subject-select")}, "別の演習を始める"),
    el("button", {class:"btn btn-ghost", onclick:()=>nav("home")}, "ホームに戻る"),
  ]));

  return root;
}

function exportData(){
  const blob = new Blob([JSON.stringify(state.data, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = el("a", {href:url, download:`kokunai_kanri_data_${Date.now()}.json`});
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast("データをエクスポートしました");
}
function importDataPrompt(){
  const input = el("input", {type:"file", accept:"application/json"});
  input.onchange = (e)=>{
    const f = e.target.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = (ev)=>{
      try{
        const obj = JSON.parse(ev.target.result);
        if(!obj.history) throw new Error("history がありません");
        if(!confirm("現在のデータを上書きします。よろしいですか？")) return;
        state.data = Object.assign(defaultData(), obj);
        saveData();
        toast("データをインポートしました");
        render();
      }catch(err){
        alert("インポートに失敗しました: " + err.message);
      }
    };
    r.readAsText(f);
  };
  input.click();
}
function resetData(){
  if(!confirm("すべての学習データを削除します。元に戻せません。本当にリセットしますか？")) return;
  try {
    localStorage.removeItem(STORAGE_KEY);
    state.data = defaultData();
    saveData();
    toast("データをリセットしました");
    render();
  } catch(e) {
    console.error("リセットに失敗しました:", e);
    alert("リセットに失敗しました: " + e.message);
  }
}

    class:"review-tab" + (state.reviewTab==="bookmark"?" active":""),
    onclick:()=>{ state.reviewTab="bookmark"; render(); }
  }, [
    document.createTextNode("ブックマーク"),
    el("span", {class:"count"}, `(${bookmarks.length})`)
  ]));
  tabs.appendChild(el("button", {
    class:"review-tab" + (state.reviewTab==="wrong"?" active":""),
    onclick:()=>{ state.reviewTab="wrong"; render(); }
  }, [
    document.createTextNode("誤答ノート"),
    el("span", {class:"count"}, `(${wrongQs.length})`)
  ]));
  card.appendChild(tabs);

  // 演習開始ボタン
  const targetQs = state.reviewTab === "bookmark" ? bookmarks : wrongQs;
  if(targetQs.length > 0){
    card.appendChild(el("div", {class:"btn-row", style:"margin-bottom:18px"}, [
      el("button", {
        class:"btn btn-primary",
        onclick:()=>startReviewPractice(state.reviewTab)
      }, `この${state.reviewTab==="bookmark"?"ブックマーク":"誤答問題"}で演習する`),
    ]));
  }

  // タブ内容
  if(targetQs.length === 0){
    card.appendChild(el("div", {class:"empty"},
      state.reviewTab === "bookmark"
        ? "まだブックマークがありません。演習中に解説下部の ☆ ボタンを押すと、ブックマークに追加できます。"
        : "誤答した問題はありません。"));
  } else {
    targetQs.forEach((q, idx)=>{
      const subj = SUBJECT_BY_ID[q.subject];
      const marks = ["ア","イ","ウ","エ","オ"];
      const bookmarked = isBookmarked(q.id);
      const reviewQ = el("div", {class:"review-q-card"});
      reviewQ.appendChild(el("div", {class:"review-q-cat"},
        `${state.reviewTab==="bookmark"?"ブックマーク":"誤答ノート"} #${idx+1}  -  ${q.category}`));
      reviewQ.appendChild(el("div", {class:"review-q-subj"},
        `${subj.no}. ${subj.name}`));
      reviewQ.appendChild(el("div", {class:"review-q-text"}, q.question));

      const choicesEl = el("div", {class:"review-q-choices"});
      q.choices.forEach((c, i)=>{
        choicesEl.appendChild(el("div", {class:"review-q-choice" + (i===q.answer?" correct":"")}, [
          el("div", {class:"mark"}, marks[i]),
          el("div", null, c)
        ]));
      });
      reviewQ.appendChild(choicesEl);

      const explainEl = el("div", {class:"review-q-explain"}, [
        el("strong", {style:"font-family:var(--font-serif);color:var(--vermillion-dark);font-weight:700"}, "解説 "),
        document.createTextNode(q.explanation),
        el("div", {class:"review-q-source"}, `出典: ${q.source}`)
      ]);
      reviewQ.appendChild(explainEl);

      // アクション行（ブックマーク解除ボタン等）
      reviewQ.appendChild(el("div", {class:"review-q-actions"}, [
        el("div", {class:"review-q-meta"},
          state.reviewTab === "wrong" ? "最新の解答が誤答だった問題です" : ""),
        el("button", {
          class:"bookmark-btn" + (bookmarked?" active":""),
          title: bookmarked ? "ブックマーク解除" : "ブックマークに追加",
          onclick:()=>{ toggleBookmark(q.id); render(); }
        }, bookmarked ? "★" : "☆")
      ]));

      card.appendChild(reviewQ);
    });
  }

  root.appendChild(card);
  return root;
}

/* 復習演習：ブックマーク or 誤答問題で演習 */
function startReviewPractice(tab){
  const qs = tab === "bookmark" ? getBookmarkedQuestions() : getWrongQuestions();
  if(qs.length === 0){
    toast("対象問題がありません");
    return;
  }
  const count = Math.min(20, qs.length);
  const queue = shuffle(qs).slice(0, count).map(q => q.id);
  state.practice = {
    subject: tab === "bookmark" ? "bookmark" : "wrong",
    qCount: count,
    queue, idx: 0,
    answers: [],
    startTime: Date.now(),
    selected: null,
    locked: false
  };
  nav("practice");
}

function startFlash(subjectId, count){
  const pool = subjectId === "all" ? QUESTIONS : QUESTIONS.filter(q=>q.subject===subjectId);
  if(pool.length === 0){ toast("対象問題がありません"); return; }
  const actualCount = Math.min(count, pool.length);
  const queue = shuffle(pool).slice(0, actualCount).map(q=>q.id);
  state.flash = {
    queue, idx: 0, flipped: false,
    again: [],           // 「もう一度」に振り分けたqid
    got: 0,              // 「覚えた」の枚数
    label: subjectId === "all" ? "全科目" : SUBJECT_BY_ID[subjectId].name
  };
  nav("flash");
}

function startFlashFromList(questions, label){
  if(questions.length === 0){ toast("対象問題がありません"); return; }
  const queue = shuffle(questions).map(q=>q.id);
  state.flash = { queue, idx:0, flipped:false, again:[], got:0, label };
  nav("flash");
}

/* ---------- 画面: フラッシュカード ---------- */
function renderFlash(){
  const f = state.flash;
  if(!f){ return renderFlashIntro(); }
  if(f.idx >= f.queue.length){ return renderFlashResult(); }

  const q = QUESTIONS.find(x=>x.id===f.queue[f.idx]);
  if(!q){ return renderFlashIntro(); }

  const root = el("div", {class:"screen"});
  root.appendChild(headerEl());

  // 進捗
  root.appendChild(el("div", {class:"flash-top"}, [
    el("div", {class:"flash-progress"}, `${f.idx+1} / ${f.queue.length}  -  ${f.label}`),
    el("div", null, `覚えた: ${f.got}`)
  ]));

  const marks = ["ア","イ","ウ","エ","オ"];
  const subj = SUBJECT_BY_ID[q.subject];

  // カード本体
  const cardInner = el("div", {class:"flashcard-inner"}, [
    // 表面（問題）
    el("div", {class:"flashcard-face front"}, [
      el("div", {class:"flashcard-label"}, `${subj.no}. ${subj.name}`),
      el("div", {class:"flashcard-cat"}, q.category),
      el("div", {class:"flashcard-q"}, q.question),
      el("div", {class:"flashcard-hint"}, "タップして答えを見る")
    ]),
    // 裏面（正解＋解説）
    el("div", {class:"flashcard-face back"}, [
      el("div", {class:"flashcard-label"}, "正解と解説"),
      el("div", {class:"flashcard-a"}, `正解: ${marks[q.answer]}  ${q.choices[q.answer]}`),
      el("div", {class:"flashcard-exp"}, q.explanation),
      el("div", {class:"flashcard-source"}, `出典: ${q.source}`)
    ])
  ]);
  const flashcard = el("div", {class:"flashcard" + (f.flipped?" flipped":""), onclick:()=>{ f.flipped = !f.flipped; render(); }}, [cardInner]);
  root.appendChild(flashcard);

  // 裏面表示時のみ自己評価ボタン
  if(f.flipped){
    root.appendChild(el("div", {class:"flash-confidence"}, [
      el("button", {class:"flash-conf-btn again", onclick:()=>flashNext(false)}, "もう一度"),
      el("button", {class:"flash-conf-btn got", onclick:()=>flashNext(true)}, "覚えた"),
    ]));
  } else {
    root.appendChild(el("div", {class:"flash-confidence"}, [
      el("button", {class:"flash-conf-btn", style:"max-width:none;color:var(--ink-soft)", onclick:()=>{ f.flipped = true; render(); }}, "答えを見る"),
    ]));
  }

  root.appendChild(el("div", {class:"flash-nav"}, [
    el("button", {class:"btn btn-ghost", onclick:()=>quitFlash()}, "終了する"),
    el("div", {style:"flex:1"}),
    el("button", {class:"btn btn-ghost", onclick:()=>{ if(!q) return; toggleBookmark(q.id); render(); }},
      isBookmarked(q.id) ? "★ ブックマーク中" : "☆ ブックマーク"),
  ]));

  return root;
}

function flashNext(got){
  const f = state.flash;
  if(!f) return;
  const qid = f.queue[f.idx];
  if(got){ f.got++; }
  else { f.again.push(qid); }
  f.idx++;
  f.flipped = false;
  // 全部終わったら、「もう一度」がある場合は続けて出題
  if(f.idx >= f.queue.length && f.again.length > 0){
    f.queue = f.again.slice();
    f.again = [];
    f.idx = 0;
    toast("「もう一度」のカードを繰り返します");
  }
  render();
}

function quitFlash(){
  if(confirm("フラッシュカードを終了しますか？")){
    state.flash = null;
    nav("home");
  }
}

function renderFlashResult(){
  const f = state.flash;
  const root = el("div", {class:"screen"});
  root.appendChild(headerEl());

  root.appendChild(el("div", {class:"result-score"}, [
    el("div", {class:"label"}, `フラッシュカード完了 -- ${f.label}`),
    el("div", {class:"ratio", html:`${f.got}<span class="total"> 枚</span>`}),
    el("div", {class:"pct"}, "すべてのカードを「覚えた」にしました")
  ]));

  root.appendChild(el("div", {class:"btn-row"}, [
    el("button", {class:"btn btn-primary", onclick:()=>{ state.flash=null; nav("flash-intro"); }}, "もう一度カードで学習"),
    el("button", {class:"btn btn-ghost", onclick:()=>{ state.flash=null; nav("home"); }}, "ホームに戻る"),
  ]));
  return root;
}

    isDaily: true

// デイリーチャレンジ完了時の記録（finishPracticeから呼ばれる）
function recordDailyResult(answers){
  const key = todayKey();
  if(isDailyDoneToday()) return; // 二重記録防止
  const correct = answers.filter(a=>a.correct).length;
  if(!state.data.dailyHistory) state.data.dailyHistory = [];
  state.data.dailyHistory.push({
    date: key,
    total: answers.length,
    correct,
    ts: Date.now()
  });
  saveData();
}

function renderMastery(){
  const root = el("div", {class:"screen"});
  root.appendChild(headerEl());

  const card = el("div", {class:"card"});
  card.appendChild(el("div", {class:"card-head"}, "論点別 習熟度マップ"));
  card.appendChild(el("div", {style:"font-size:13px;color:var(--ink-soft);line-height:1.8"},
    "演習履歴に基づき、論点ごとの正答率と習熟度を表示します。論点をクリックすると、その論点だけで演習できます。"));

  // 凡例
  const legend = el("div", {class:"mastery-legend"}, [
    el("div", {class:"item"}, [el("span", {class:"dot", style:"background:var(--ink-faint)"}), document.createTextNode("未習得（1回以下）")]),
    el("div", {class:"item"}, [el("span", {class:"dot", style:"background:var(--vermillion)"}), document.createTextNode("要強化（〜40%）")]),
    el("div", {class:"item"}, [el("span", {class:"dot", style:"background:#d9651a"}), document.createTextNode("弱（〜60%）")]),
    el("div", {class:"item"}, [el("span", {class:"dot", style:"background:var(--gold)"}), document.createTextNode("普通（〜80%）")]),
    el("div", {class:"item"}, [el("span", {class:"dot", style:"background:#5a8c5e"}), document.createTextNode("良（〜100%）")]),
    el("div", {class:"item"}, [el("span", {class:"dot", style:"background:var(--correct)"}), document.createTextNode("完全（100%）")]),
  ]);
  card.appendChild(legend);

  // 絞り込みフィルタ
  const filterRow = el("div", {class:"filter-row"});
  filterRow.appendChild(el("span", {class:"filter-label"}, "絞り込み:"));
  const filters = [
    {id:"all",         label:"すべて"},
    {id:"unattempted", label:"未演習"},
    {id:"weak",        label:"要強化・弱"},
    {id:"strong",      label:"良・完全"},
  ];
  filters.forEach(f=>{
    filterRow.appendChild(el("button", {
      class:"filter-chip" + (state.masteryFilter===f.id?" active":""),
      onclick:()=>{ state.masteryFilter = f.id; render(); }
    }, f.label));
  });
  card.appendChild(filterRow);

  // 全カテゴリを科目別に整理
  const allCats = {};
  SUBJECTS.forEach(s=>{ allCats[s.id] = new Map(); });
  QUESTIONS.forEach(q=>{
    if(!allCats[q.subject]) return;
    if(!allCats[q.subject].has(q.category)){
      allCats[q.subject].set(q.category, []);
    }
    allCats[q.subject].get(q.category).push(q.id);
  });

  // 履歴統計を取得
  const stats = statsByCategory();
  const statMap = {};
  stats.forEach(s => { statMap[`${s.subject}::${s.category}`] = s; });

  // フィルタ判定関数
  const matchFilter = (attempts, pct) => {
    if(state.masteryFilter === "all") return true;
    if(state.masteryFilter === "unattempted") return attempts < 2;
    if(state.masteryFilter === "weak")        return attempts >= 2 && pct < 60;
    if(state.masteryFilter === "strong")      return attempts >= 2 && pct >= 80;
    return true;
  };

  // 科目別に表示
  let displayedAny = false;
  SUBJECTS.forEach(s=>{
    const cats = Array.from(allCats[s.id].keys()).sort();
    const filteredCats = cats.filter(catName=>{
      const st = statMap[`${s.id}::${catName}`];
      return matchFilter(st ? st.attempts : 0, st ? st.pct : 0);
    });
    if(filteredCats.length === 0) return;
    displayedAny = true;

    const section = el("div", {class:"mastery-section"});
    section.appendChild(el("div", {class:"mastery-section-head"},
      `${s.no}. ${s.name} （${filteredCats.length}論点）`));
    const grid = el("div", {class:"mastery-grid"});
    filteredCats.forEach(catName=>{
      const key = `${s.id}::${catName}`;
      const st = statMap[key];
      const attempts = st ? st.attempts : 0;
      const pct = st ? st.pct : 0;
      const correct = st ? st.correct : 0;
      const ml = masteryLevel(pct, attempts);
      const cell = el("div", {
        class:"mastery-cell",
        style:`border-left-color:${ml.color}`,
        title: "クリックでこの論点だけ演習",
        onclick:()=>startCategoryPractice(s.id, catName)
      }, [
        el("div", {class:"name"}, [
          document.createTextNode(catName),
          el("div", {class:"meta"}, attempts>0 ? `${correct}/${attempts}回 / ${ml.label}` : `未演習`)
        ]),
        el("div", {class:"pct", style:`color:${ml.color}`}, attempts>0 ? `${pct}%` : "-"),
      ]);
      grid.appendChild(cell);
    });
    section.appendChild(grid);
    card.appendChild(section);
  });

  if(!displayedAny){
    card.appendChild(el("div", {class:"empty"}, "該当する論点がありません。"));
  }

  card.appendChild(el("div", {class:"btn-row", style:"margin-top:18px"}, [
    el("button", {class:"btn btn-primary", onclick:()=>startWeakPractice()}, "苦手論点で演習する"),
    el("button", {class:"btn btn-ghost", onclick:()=>nav("home")}, "ホームに戻る"),
  ]));

  root.appendChild(card);
  return root;
}

    answers: [],

}

// 模試の構成定義（2モード）
const MOCK_MODES = {
  standard: {
    label: "本試験準拠",

    perSubject: { law: 25, yakkan: 25, domestic: 38 },

    subjectTotal: 100,
    passingScore: 60,    // 各科目60点以上で科目合格
    timeLimit: 160 * 60  // 制限時間：本試験に準じ160分（前半・後半各80分）
  },
  quick: {
    label: "簡易（各20問）",
    perSubject: { law: 20, yakkan: 20, domestic: 20 },
    subjectTotal: 100,
    passingScore: 60,
    timeLimit: 60 * 60   // 60分

};

// 1問あたりの配点を計算（科目100点を問題数で割る。採点時に使用）
function mockPointPerQ(mode, subjectId){
  const n = MOCK_MODES[mode].perSubject[subjectId];
  return MOCK_MODES[mode].subjectTotal / n;
}

  if(state.mockMode === "standard"){

      el("strong", null, "本試験準拠モードについて: "),

    ]));
  } else {
    card.appendChild(el("div", {class:"note", style:"margin-top:14px"}, [
      el("strong", null, "簡易モードについて: "),
      document.createTextNode("各科目20問の短縮版です。手早く実力を確認したいときに利用してください。本試験と同じ問題数で挑戦したい場合は「本試験準拠」モードを選んでください。")
    ]));
  }

  card.appendChild(el("div", {class:"btn-row", style:"margin-top:20px"}, [
    el("button", {class:"btn btn-primary", onclick:()=>startMock()}, "模試を開始する"),
    el("button", {class:"btn btn-ghost", onclick:()=>nav("home")}, "戻る"),
  ]));

  root.appendChild(card);
  return root;
}

/* ---------- 模試 開始 ---------- */
function startMock(){
  const mode = MOCK_MODES[state.mockMode];
  // 各科目からモード規定数をランダム抽出
  const queue = [];
  SUBJECTS.forEach(s=>{
    const pool = QUESTIONS.filter(q => q.subject === s.id);
    const n = mode.perSubject[s.id];
    const picked = shuffle(pool).slice(0, n);
    picked.forEach(q => queue.push(q.id));
  });

  if(queue.length === 0){
    alert("出題可能な問題がありません");
    return;
  }

  state.mock = {
    mode: state.mockMode,           // 実施したモードを記録
    queue,                          // 問題IDの配列（科目順）
    idx: 0,                         // 現在の問題インデックス
    answers: {},                    // {qid: choiceIndex}
    startTime: Date.now(),
    remaining: mode.timeLimit,
    timerId: null,
    finished: false
  };

  // タイマー開始
  state.mock.timerId = setInterval(()=>{
    if(!state.mock) return;
    state.mock.remaining--;
    if(state.mock.remaining <= 0){
      finishMock(true); // 時間切れ
    } else {
      // タイマー表示だけ更新（DOM操作で軽量化）
      const timerEl = $("#mock-timer");
      if(timerEl){
        timerEl.textContent = formatTime(state.mock.remaining);
        if(state.mock.remaining <= 300){ // 残り5分
          timerEl.classList.add("warn");
        }
      }
    }
  }, 1000);

  nav("mock");
}

function formatTime(sec){
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

/* ---------- 画面: 模試 ---------- */
function renderMock(){
  const m = state.mock;
  if(!m){ return renderMockIntro(); }
  const qid = m.queue[m.idx];
  const q = QUESTIONS.find(x => x.id === qid);
  if(!q){ return renderMockIntro(); }

  const root = el("div", {class:"screen"});
  root.appendChild(headerEl());

  const card = el("div", {class:"card"});

  // 上部バー（タイマー・進捗）
  const answered = Object.keys(m.answers).length;
  card.appendChild(el("div", {class:"mock-bar"}, [
    el("div", {class:"mock-progress"}, [
      el("span", {class:"qnum"}, `${m.idx+1}`),
      document.createTextNode(` / ${m.queue.length}問  -  解答済: ${answered}問`),
    ]),
    el("div", {class:"mock-timer", id:"mock-timer"}, formatTime(m.remaining)),
  ]));

  // 問題
  const subjName = SUBJECT_BY_ID[q.subject].name;
  card.appendChild(el("div", {class:"q-source"}, `SUBJECT ${SUBJECT_BY_ID[q.subject].no}  -  ${subjName}`));
  card.appendChild(el("div", {class:"q-text"}, q.question));

  const choicesEl = el("div", {class:"choices"});
  const marks = ["ア","イ","ウ","エ","オ"];
  const selected = m.answers[qid];
  q.choices.forEach((c, i)=>{
    let cls = "choice";
    if(selected === i) cls += " selected";
    const btn = el("button", {class:cls, onclick: ()=>selectMockChoice(i)}, [
      el("div", {class:"mark"}, marks[i]),
      el("div", {class:"choice-text"}, c)
    ]);
    choicesEl.appendChild(btn);
  });
  card.appendChild(choicesEl);

  // ナビゲーション
  const isFirst = m.idx === 0;
  const isLast = m.idx === m.queue.length - 1;
  card.appendChild(el("div", {class:"mock-nav"}, [
    el("button", {class:"btn btn-ghost", onclick:()=>navMock(-1), disabled: isFirst ? "" : null}, "前の問題へ"),
    el("button", {class:"btn", onclick:()=>navMock(1), disabled: isLast ? "" : null}, "次の問題へ"),
    isLast
      ? el("button", {class:"btn btn-primary", onclick:()=>confirmFinishMock()}, "解答を終えて採点")
      : null,
    el("button", {class:"btn btn-ghost", style:"margin-left:auto;color:var(--vermillion);border-color:var(--vermillion)", onclick:()=>confirmAbortMock()}, "中断"),
  ]));

  root.appendChild(card);

  // 問題一覧（マーク）
  const gridCard = el("div", {class:"card"});
  gridCard.appendChild(el("div", {class:"card-head"}, "問題一覧（クリックで移動）"));
  // 科目ごとに分けて表示
  SUBJECTS.forEach(s=>{
    const sQs = m.queue.map((qid,idx)=>({qid,idx})).filter(x => {
      const qq = QUESTIONS.find(y=>y.id===x.qid);
      return qq && qq.subject === s.id;
    });
    if(sQs.length === 0) return;
    gridCard.appendChild(el("div", {style:"font-size:11px;color:var(--ink-faint);letter-spacing:.15em;margin:14px 0 6px;text-transform:uppercase"},
      `${s.no}. ${s.name}`));
    const grid = el("div", {class:"mock-grid"});
    sQs.forEach(x=>{
      let cls = "mock-cell";
      if(x.idx === m.idx) cls += " current";
      else if(m.answers[x.qid] !== undefined) cls += " answered";
      grid.appendChild(el("button", {class:cls, onclick:()=>jumpMock(x.idx)}, `${x.idx+1}`));
    });
    gridCard.appendChild(grid);
  });
  root.appendChild(gridCard);

  return root;
}

function selectMockChoice(i){
  const m = state.mock;
  if(!m) return;
  const qid = m.queue[m.idx];
  m.answers[qid] = i;
  render();
}

function navMock(delta){
  const m = state.mock;
  if(!m) return;
  const next = m.idx + delta;
  if(next < 0 || next >= m.queue.length) return;
  m.idx = next;
  render();
}

function jumpMock(idx){
  const m = state.mock;
  if(!m) return;
  if(idx < 0 || idx >= m.queue.length) return;
  m.idx = idx;
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

function confirmFinishMock(){
  const m = state.mock;
  if(!m) return;
  const unanswered = m.queue.length - Object.keys(m.answers).length;
  let msg = "解答を確定し、採点を行います。よろしいですか？";
  if(unanswered > 0){
    msg = `${unanswered}問が未解答です。このまま採点すると、未解答の問題は不正解として扱われます。よろしいですか？`;
  }
  if(confirm(msg)){
    finishMock(false);
  }
}

function confirmAbortMock(){
  if(confirm("模試を中断します。結果は記録されません。本当に中断しますか？")){
    abortMock();
  }
}

function abortMock(){
  if(state.mock && state.mock.timerId){
    clearInterval(state.mock.timerId);
  }
  state.mock = null;
  nav("home");
}

function finishMock(timeUp){
  const m = state.mock;
  if(!m || m.finished) return;
  m.finished = true;
  if(m.timerId){ clearInterval(m.timerId); m.timerId = null; }

  const mode = MOCK_MODES[m.mode] || MOCK_MODES.quick;

  // 採点：科目ごとに正答数をカウントし、100点満点に換算
  const subjectCorrect = {};   // 正答数
  const subjectTotal = {};     // 出題数
  const details = [];
  SUBJECTS.forEach(s=>{ subjectCorrect[s.id] = 0; subjectTotal[s.id] = 0; });

  m.queue.forEach(qid=>{
    const q = QUESTIONS.find(x=>x.id===qid);
    if(!q) return;
    subjectTotal[q.subject]++;
    const ans = m.answers[qid];
    const correct = (ans !== undefined && ans === q.answer);
    if(correct){
      subjectCorrect[q.subject]++;
    }
    details.push({
      qid,
      answered: ans !== undefined ? ans : -1,
      correct
    });
  });

  // 100点満点換算（四捨五入）
  const subjectScores = {};
  SUBJECTS.forEach(s=>{
    const n = subjectTotal[s.id];
    subjectScores[s.id] = n > 0 ? Math.round(subjectCorrect[s.id] / n * mode.subjectTotal) : 0;
  });

  const passed = SUBJECTS.every(s => subjectScores[s.id] >= mode.passingScore);
  const duration = mode.timeLimit - m.remaining;

  // 履歴保存
  if(!state.data.mockHistory) state.data.mockHistory = [];
  state.data.mockHistory.push({
    date: Date.now(),
    mode: m.mode,
    duration,
    scores: subjectScores,
    correctCounts: subjectCorrect,
    totalCounts: subjectTotal,
    passed,
    details,
    timeUp
  });
  saveData();

  // 結果画面状態
  state.mock = {
    finished: true,
    mode: m.mode,
    queue: m.queue,
    answers: m.answers,
    scores: subjectScores,
    correctCounts: subjectCorrect,
    totalCounts: subjectTotal,
    details,
    passed,
    duration,
    timeUp
  };

  nav("mock-result");
}

    });

  root.appendChild(reviewCard);

  root.appendChild(el("div", {class:"btn-row"}, [
    el("button", {class:"btn btn-primary", onclick:()=>{state.mock=null; nav("mock-intro");}}, "もう一度模試を受ける"),
    el("button", {class:"btn btn-ghost", onclick:()=>{state.mock=null; nav("home");}}, "ホームに戻る"),
  ]));

  return root;
}

/* ---------- PWA: manifest（実ファイルがあればそれを使い、無ければ動的生成） ----------
   HTMLには <link rel="manifest" href="manifest.webmanifest"> を静的に記述済み。
   manifest.webmanifest と icon-192.png / icon-512.png が同階層にあれば
   それが使われる（インストール可能性が最も高い標準構成）。
   実ファイルが無い環境（単体HTMLのみ）では、以下が動的にフォールバック生成する。 */
(function setupManifestFallback(){
  // 既存の静的manifestリンクが実ファイルとして取得できるか確認
  const existing = document.querySelector('link[rel="manifest"]');
  const manifestHref = existing ? existing.href : null;

  function buildDynamicManifest(){
    try{
      function makeIconPng(size){
        const canvas = document.createElement("canvas");
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext("2d");
        const s = size / 512;
        ctx.fillStyle = "#1a2b4a";
        ctx.fillRect(0, 0, size, size);
        ctx.strokeStyle = "#b88a2a";
        ctx.lineWidth = 8 * s;
        ctx.strokeRect(56 * s, 56 * s, 400 * s, 400 * s);
        ctx.textAlign = "center";
        ctx.font = "700 " + (150 * s) + "px serif";
        ctx.fillStyle = "#fbfaf4";
        ctx.fillText("国内", 256 * s, 210 * s);
        ctx.fillStyle = "#b8362a";
        ctx.fillText("管理", 256 * s, 370 * s);
        return canvas.toDataURL("image/png");
      }
      const icon192 = makeIconPng(192);
      const icon512 = makeIconPng(512);
      const baseUrl = location.href.substring(0, location.href.lastIndexOf("/") + 1);
      const manifest = {
        name: "国内旅行業務取扱管理者試験 問題演習",
        short_name: "国内管理者演習",
        description: "国内旅行業務取扱管理者試験の独学用問題演習アプリ（非公式）",
        start_url: baseUrl,
        scope: baseUrl,
        id: baseUrl,
        display: "standalone",
        orientation: "portrait",
        background_color: "#f4f1e8",
        theme_color: "#1a2b4a",
        lang: "ja",
        icons: [
          { src: icon192, sizes: "192x192", type: "image/png", purpose: "any" },
          { src: icon512, sizes: "512x512", type: "image/png", purpose: "any" },
          { src: icon512, sizes: "512x512", type: "image/png", purpose: "maskable" }
        ]
      };
      const manifestBlob = new Blob([JSON.stringify(manifest)], {type:"application/manifest+json"});
      const manifestUrl = URL.createObjectURL(manifestBlob);
      // 既存の静的リンクを置き換える（または新規追加）
      if(existing){ existing.href = manifestUrl; }
      else {
        const link = document.createElement("link");
        link.rel = "manifest";
        link.href = manifestUrl;
        document.head.appendChild(link);
      }
      // アイコンも動的版に差し替え（実ファイルが無い場合）
      let appleIcon = document.querySelector('link[rel="apple-touch-icon"]');
      if(!appleIcon){ appleIcon = document.createElement("link"); appleIcon.rel = "apple-touch-icon"; document.head.appendChild(appleIcon); }
      appleIcon.href = icon192;
      let favicon = document.querySelector('link[rel="icon"]');
      if(!favicon){ favicon = document.createElement("link"); favicon.rel = "icon"; document.head.appendChild(favicon); }
      favicon.href = icon192;
    }catch(e){
      console.warn("dynamic manifest failed", e);
    }
  }

  if(!manifestHref){
    buildDynamicManifest();
    return;
  }
  // 実ファイルの manifest が取得できるか確認。取得できなければ動的生成にフォールバック
  fetch(manifestHref, {method:"GET"}).then((resp)=>{
    if(!resp || !resp.ok){
      buildDynamicManifest();
    }
    // 取得できた場合は静的manifestをそのまま使う（何もしない）
  }).catch(()=>{
    buildDynamicManifest();
  });
})();

/* ---------- PWA: Service Worker 登録（オフライン対応） ----------
   別ファイル sw.js が同階層に存在する場合に登録する。
   sw.js がオフライン化とインストール可能性（fetchハンドラ）を担う。
   sw.js が無くても manifest によるホーム画面追加は可能。
   file:// では登録しない。 */
(function setupServiceWorker(){
  if(!("serviceWorker" in navigator)) return;
  if(location.protocol !== "https:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") return;
  // 同階層の sw.js の絶対URLを組み立てる
  const base = location.href.substring(0, location.href.lastIndexOf("/") + 1);
  const swUrl = base + "sw.js";
  // sw.js の存在を確認してから登録（存在しない場合の登録エラーを避ける）
  fetch(swUrl, {method:"GET", cache:"no-store"}).then((resp)=>{
    if(resp && resp.ok){
      navigator.serviceWorker.register(swUrl, {scope: base}).then(()=>{
        console.log("Service Worker 登録成功");
      }).catch((err)=>{
        console.warn("SW registration failed", err);
      });
    } else {
      console.warn("sw.js が見つかりません。オフライン機能は無効です（ホーム画面追加は利用可能）。");
    }
  }).catch(()=>{
    console.warn("sw.js の確認に失敗しました。オフライン機能は無効です。");
  });
})();

/* ---------- 起動 ---------- */
render();
</script>
</body>
</html>
